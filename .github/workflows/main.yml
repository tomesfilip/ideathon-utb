name: Build and deploy to production on main push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build project
        run: npm ci && npm run build

      - name: Install openconnect
        run: sudo apt-get update && sudo apt-get install -y openconnect

      - name: Connect to Cisco AnyConnect VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
            --user=${{ secrets.VPN_USERNAME }} \
            --passwd-on-stdin \
            ${{ secrets.VPN_SERVER }} \
            --background
          sleep 10

      - name: Verify VPN connection
        run: curl ifconfig.me

      - name: Debug VPN reachability
        run: |
          echo "Testing DNS:"
          nslookup ${{ secrets.FTP_SERVER }} || true
          echo "Testing TCP port 22:"
          nc -vz ${{ secrets.FTP_SERVER }} 22 || true
          echo "Routing table:"
          ip route

      - name: SFTP uploader
        uses: wangyucode/sftp-upload-action@v3.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          localDir: dist/
          remoteDir: www/
